name: arXiv cs.AI Daily Digest (Gemini)

on:
  schedule:
    # 02:00 UTC = 10:00 HKT daily. 3-day back-window + id dedup means no paper
    # is dropped even if a run is late/skips a day.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      back_days:
        description: "Override lookback window (days)"
        required: false
        default: ""
        type: string
      max_candidates:
        description: "Max papers to analyse"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: arxiv-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Gemini auth (env cookies -> auth.json)
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          mkdir -p ~/.gemini-cli
          printf '{"__Secure-1PSID":"%s","__Secure-1PSIDTS":"%s"}\n' \
            "$GEMINI_SID" "$GEMINI_TS" > ~/.gemini-cli/auth.json

      - name: Run arXiv Gemini digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: |
          if [ -n "${{ github.event.inputs.back_days }}" ]; then
            RUN_BACK_DAYS="${{ github.event.inputs.back_days }}" \
            MAX_CANDIDATES="${{ github.event.inputs.max_candidates }}" \
            python3 arxiv_gem_daily.py
          else
            python3 arxiv_gem_daily.py
          fi
