name: arXiv cs.AI Daily Digest (Gemini)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      back_days:
        description: "Override lookback window (days; default 2)"
        required: false
        default: ""
        type: string
      max_candidates:
        description: "Max papers to analyse"
        required: false
        default: ""
        type: string
      fetch_source:
        description: "auto (default) or rss — force the RSS fallback path (test)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: arxiv-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Gemini auth (env cookies -> auth.json)
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          mkdir -p ~/.gemini-cli
          printf '{"__Secure-1PSID":"%s","__Secure-1PSIDTS":"%s"}\n' \
            "$GEMINI_SID" "$GEMINI_TS" > ~/.gemini-cli/auth.json

      - name: Setup NotebookLM session (storage state)
        env:
          NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}
        run: |
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NLM_STORAGE_STATE_GZ" | base64 -d | gunzip >             ~/.notebooklm/profiles/default/storage_state.json
          python3 -c "import json;d=json.load(open('$HOME/.notebooklm/profiles/default/storage_state.json'));print('nlm cookies:',len(d.get('cookies',[])))"

      - name: Install playwright + CJK fonts (infographic download/render)
        run: |
          pip install playwright
          python3 -m playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq             fonts-noto-cjk

      - name: Restore seen-papers state
        uses: actions/cache@v4
        with:
          path: state
          key: arxiv-seen-v1

      - name: Run arXiv Gemini digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          NOTEBOOKLM_TRANSPORT: curl_cffi
          ARXIV_FETCH_SOURCE: ${{ github.event.inputs.fetch_source }}
        run: |
          if [ -n "${{ github.event.inputs.back_days }}" ]; then
            RUN_BACK_DAYS="${{ github.event.inputs.back_days }}" \
            MAX_CANDIDATES="${{ github.event.inputs.max_candidates }}" \
            python3 arxiv_gem_daily.py
          else
            python3 arxiv_gem_daily.py
          fi

      - name: Upload digest artifacts (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-digest-output
          path: |
            ~/.hermes/digest_images/
            /tmp/digest_*.html
            /tmp/arxiv_digest_email.html
          if-no-files-found: ignore
          retention-days: 3
