name: arXiv cs.AI Daily Digest (Gemini)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      back_days:
        description: "Override lookback window (days; default 2)"
        required: false
        default: ""
        type: string
      max_candidates:
        description: "Max papers to analyse"
        required: false
        default: ""
        type: string
      fetch_source:
        description: "auto (default) or rss — force the RSS fallback path (test)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "1 = exercise the pipeline but do NOT send the email"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: arxiv-digest
      cancel-in-progress: false
    env:
      # Mapped once at job level so step `if:` conditions can test it:
      # the `secrets` context is NOT available inside `if:` expressions
      # (GitHub rejects the whole workflow at parse time), but `env` is.
      NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the state-commit step rebases before pushing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Preflight — required repository secrets
        # Public repo: a forker must supply their own secrets, and a missing one
        # must fail HERE with a clear message instead of surfacing as a misleading
        # auth/quota error mid-run (or silently producing no digest).
        # Only secret NAMES are ever printed — never values.
        # LLM path is cookies and/or GEMINI_API_KEY (at least one required);
        # SMTP trio is always required.
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}
        run: |
          missing=""
          for v in SMTP_USER SMTP_PASS RECIPIENT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing required repository secret(s):$missing — add them under Settings → Secrets and variables → Actions (see README 'Secrets')."
            exit 1
          fi
          echo "required secrets present: SMTP_USER SMTP_PASS RECIPIENT (values never printed)"
          if [ -z "$GEMINI_SID" ] || [ -z "$GEMINI_TS" ]; then
            echo "::warning::GEMINI_SID/TS not set — web backend disabled"
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY not set — no API fallback (add it; web cookies are single-point-of-failure)"
          fi
          if [ -z "$GEMINI_SID" ] && [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::no LLM path configured (need cookies and/or GEMINI_API_KEY)"
            exit 1
          fi
          if [ -z "$NLM_STORAGE_STATE_GZ" ]; then
            echo "::warning::NLM_STORAGE_STATE_GZ not set — NotebookLM infographic will be skipped (the matplotlib chart still ships)"
          fi

      - name: Setup Gemini auth (env cookies -> auth.json)
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          mkdir -p ~/.gemini-cli
          printf '{"__Secure-1PSID":"%s","__Secure-1PSIDTS":"%s"}\n' \
            "$GEMINI_SID" "$GEMINI_TS" > ~/.gemini-cli/auth.json

      - name: Setup NotebookLM session (storage state)
        # Skipped when the secret is absent: the preflight only warns, and
        # the script degrades to the local chart — the setup must not fail
        # the whole digest for a missing/expired NLM session.
        if: ${{ env.NLM_STORAGE_STATE_GZ != '' }}
        run: |
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NLM_STORAGE_STATE_GZ" | base64 -d | gunzip >             ~/.notebooklm/profiles/default/storage_state.json
          python3 -c "import json;d=json.load(open('$HOME/.notebooklm/profiles/default/storage_state.json'));print('nlm cookies:',len(d.get('cookies',[])))"

      - name: Install playwright + CJK fonts (infographic download/render)
        # Only needed when NotebookLM is configured (see above).
        if: ${{ env.NLM_STORAGE_STATE_GZ != '' }}
        run: |
          pip install playwright
          python3 -m playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq             fonts-noto-cjk

      - name: Restore seen-papers state
        uses: actions/cache@v4
        with:
          path: state
          # Rolling key: a fixed key always HITS, and a hit skips the save,
          # so the dedup state would stay frozen and every run would
          # re-report the whole window. Unique key + prefix restore keeps the
          # newest snapshot flowing to the next run.
          key: arxiv-seen-${{ github.run_id }}
          restore-keys: arxiv-seen-

      - name: Run arXiv Gemini digest
        id: digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTEBOOKLM_TRANSPORT: curl_cffi
          ARXIV_FETCH_SOURCE: ${{ github.event.inputs.fetch_source }}
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # Each dispatch input is passed independently (previously
          # max_candidates was silently ignored unless back_days was set).
          if [ -n "${{ github.event.inputs.back_days }}" ]; then
            export RUN_BACK_DAYS="${{ github.event.inputs.back_days }}"
          fi
          if [ -n "${{ github.event.inputs.max_candidates }}" ]; then
            export MAX_CANDIDATES="${{ github.event.inputs.max_candidates }}"
          fi
          python3 arxiv_gem_daily.py

      - name: Commit digest state (keeps the 60-day clock reset)
        # The seen/deferred state is the only stateful data, and it lives in
        # actions/cache — but a cache-only state never pushes, so the repo
        # still hits GitHub's 60-day scheduled-workflow disable (last push
        # 2026-10-03; warning 2026-11-25). Committing the state after every
        # successful run makes each run its own keepalive. Force-add: the
        # files stay gitignored locally so a dev machine never commits them
        # by accident — only CI commits them, only on a successful run.
        # Runs only when the digest step succeeded: if the email failed, the
        # script exits non-zero and the state is NOT committed, so those
        # papers are retried next run instead of being marked seen-and-lost.
        # A failed push only warns (the cache still holds the state); the
        # keepalive workflow is the backstop for the 60-day clock.
        if: steps.digest.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/seen_ids.json state/deferred_ids.json
          if git diff --cached --quiet; then
            echo "digest state unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "digest state $(date -u +%Y-%m-%d)" --quiet
          git pull --rebase --quiet && git push --quiet || \
            echo "::warning::digest-state push failed (state still in cache; keepalive workflow is the backstop)"

      - name: Upload digest artifacts (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-digest-output
          path: |
            ~/.hermes/digest_images/arxiv/chart_*.png
            ~/.hermes/digest_images/arxiv/nlm_*.png
            /tmp/arxiv_digest_email.html
          if-no-files-found: ignore
          retention-days: 3
